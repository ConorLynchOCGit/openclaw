name: Docs Release Bundle

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-release-docs-bundle:
    if: ${{ github.repository == 'ConorLynchOCGit/openclaw-platform' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Build release-tagged docs bundle
        env:
          DOCS_BUNDLE_DIR: ${{ runner.temp }}/openclaw-release-docs-bundle-${{ github.run_id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "Cross-repo locale dispatch is retired for the downstream repo. Building a same-repo release bundle artifact instead."
          node scripts/docs-sync-publish.mjs \
            --target "${DOCS_BUNDLE_DIR}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --release-tag "${RELEASE_TAG}"

      - name: Upload release docs bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-docs-bundle-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/openclaw-release-docs-bundle-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
