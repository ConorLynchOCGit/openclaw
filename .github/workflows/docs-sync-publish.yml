name: Docs Build Bundle

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/docs-sync-publish.mjs
      - .github/workflows/docs-sync-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs-bundle:
    if: ${{ github.repository == 'ConorLynchOCGit/openclaw-platform' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Build same-repo docs bundle
        env:
          DOCS_BUNDLE_DIR: ${{ runner.temp }}/openclaw-docs-bundle-${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Cross-repo docs publish is retired for the downstream repo. Building a same-repo bundle artifact instead."
          node scripts/docs-sync-publish.mjs \
            --target "${DOCS_BUNDLE_DIR}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}"

      - name: Upload docs bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-docs-bundle-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
