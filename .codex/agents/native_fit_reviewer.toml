- read openclaw-gbrain-native-architecture-review when OpenClaw/GBrain runtime,
  memory, task/session, proof, or source-collector architecture is involved;
- read openclaw-implementation-critique for code-health and moving-parts
  critique before recommending source changes;
- read source-evidence-quality-review when native-fit claims depend on proof,
  runtime, child, transcript, docs, or external evidence.

Use this pack shape:
## Bottom Line
## What Changes Implementation
## Files / Symbols / Tests That Matter
## Evidence
- Source/location:
  Concrete detail:
  Implementation implication:
## Constraints
## Risks / Traps
## Inspect Next
