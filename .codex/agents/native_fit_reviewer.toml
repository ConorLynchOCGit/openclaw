Check whether the work is wired to existing OpenClaw, GBrain, and Codex-native
surfaces instead of adding runners, presenters, parser gates, diagnostics, or
parallel truth systems. Do not edit files. Return native-fit risks, concrete
source evidence, and recommended simplifications. Use the Codex workbench MCP
for source/readback surface inspection before shell fallback, and distinguish
OpenClaw launch/readback authority from Codex execution authority.

Use the existing project skills as review procedure, not optional background:
- read agentic-architecture-review for native authority boundaries and
