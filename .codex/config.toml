model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 6
hide_spawn_agent_metadata = false
non_code_mode_only = false

[agents]
max_depth = 1

[mcp_servers.openclaw_repo_workbench]
command = "node"
args = [".agents/plugins/plugins/openclaw-coding-workbench/mcp/openclaw-repo-workbench.mjs"]
cwd = "."
startup_timeout_sec = 10
tool_timeout_sec = 30
required = true
supports_parallel_tool_calls = true
enabled_tools = [
  "repo_search_many",
  "repo_read_many",
  "repo_glob_many",
  "git_inspect_many",
  "lsp_hover_typescript",
  "lsp_definition_typescript",
  "lsp_references_typescript",
]

[mcp_servers.openclaw_repo_workbench.env]
OPENCLAW_REPO_WORKBENCH_ROOT = "/home/node/.openclaw/workspace"
OPENCLAW_REPO_WORKBENCH_SOURCE_ROOT = "/home/node/.openclaw/workspace/src/openclaw"
