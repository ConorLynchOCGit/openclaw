version: 3
status: live_runtime_reconciled_with_durable_packs
notes:
  - This registry now reflects the actual live runtime agent set on the VPS.
  - docs/agents/ now has durable base packs for the live runtime agent set.
  - Chief intentionally shares the main runtime compatibility source surface while keeping a dedicated durable pack.
requiredDurableRoot: docs/agents
runtimeRoots:
  - .agents
  - live-runtime:/root/.openclaw
  - live-runtime-alias:/home/node/.openclaw
liveRuntimeSource:
  container: openclaw-runtime
  runtimeHome: /root/.openclaw
  runtimeHomeAliasPath: /home/node/.openclaw
  configPath: /root/.openclaw/openclaw.json
  configAliasPath: /home/node/.openclaw/openclaw.json
  aliasStatus: compatibility_alias_only
  evidenceCommand: docker exec openclaw-runtime openclaw agents list --json
liveRuntimeAgents:
  - id: main
    title: OpenClaw
    lifecycle: live
    configured: true
    workspacePath: /root/.openclaw/workspace
    workspaceAliasPath: /home/node/.openclaw/workspace
    workspaceStatus: present_shared_canonicalized
    sessionStorePath: /root/.openclaw/agents/main/sessions/sessions.json
    sessionStoreAliasPath: /home/node/.openclaw/agents/main/sessions/sessions.json
    sessionState: present
    uiVisibility:
      agentsList: true
      sessionSelector: true
    docsStatus: durable_pack_and_runtime_sources_present
    status: live_and_initialized
  - id: chief
    title: OpenClaw
    lifecycle: live
