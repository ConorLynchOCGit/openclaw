services:
  openclaw-gateway:
    container_name: openclaw-runtime
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${OPENCLAW_CONFIG_DIR}/.env
    labels:
      io.openclaw.stack: live
      io.openclaw.role: runtime
      io.openclaw.surface: gateway
    environment:
      HOME: /home/node
      CODEX_HOME: /home/node/.openclaw/external-auth/codex
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/home/node/.openclaw/.cache/ms-playwright}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      MODEL_MEMORY_HOOK_PROBE_ENABLED: ${MODEL_MEMORY_HOOK_PROBE_ENABLED:-true}
      MODEL_MEMORY_HOOK_PROBE_OUTPUT_DIR: ${MODEL_MEMORY_HOOK_PROBE_OUTPUT_DIR:-/app/.openclaw-memory-ops/hook-runtime-canaries}
      MODEL_MEMORY_ACTIVITY_FEED_ENABLED: ${MODEL_MEMORY_ACTIVITY_FEED_ENABLED:-true}
      MODEL_MEMORY_ACTIVITY_FEED_LEVEL: ${MODEL_MEMORY_ACTIVITY_FEED_LEVEL:-maximal}
      MODEL_MEMORY_PROJECTION_ARTIFACTS_ENABLED: ${MODEL_MEMORY_PROJECTION_ARTIFACTS_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAMS_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAMS_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_OUTPUT_DIR: ${MODEL_MEMORY_CAPTURE_SEAM_OUTPUT_DIR:-/app/.openclaw-memory-ops/capture-seam-runtime}
      MODEL_MEMORY_CAPTURE_SEAM_MESSAGE_PREPROCESSED_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_MESSAGE_PREPROCESSED_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_BATCH_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_BATCH_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_ASSEMBLE_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_ASSEMBLE_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_AFTER_TURN_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_AFTER_TURN_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_TOOL_RESULT_PERSIST_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_TOOL_RESULT_PERSIST_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_AFTER_TOOL_CALL_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_AFTER_TOOL_CALL_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_AGENT_END_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_AGENT_END_ENABLED:-true}
      MODEL_MEMORY_TOOL_RESULT_PROOF_CAPTURE_ENABLED: ${MODEL_MEMORY_TOOL_RESULT_PROOF_CAPTURE_ENABLED:-true}
      MODEL_MEMORY_CONTEXT_INGEST_PRODUCTION_PROBE_ENABLED: ${MODEL_MEMORY_CONTEXT_INGEST_PRODUCTION_PROBE_ENABLED:-true}
      MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_ENABLED: ${MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_ENABLED:-true}
      MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_MODEL: ${MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_MODEL:-openai-codex/gpt-5.4}
      MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_REASONING_EFFORT: ${MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_REASONING_EFFORT:-medium}
      MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_VERBOSITY: ${MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_VERBOSITY:-low}
      MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_TIMEOUT_MS: ${MODEL_MEMORY_PHASE2_MODEL_AUTHORED_BRIEFS_TIMEOUT_MS:-45000}
      MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_ENABLED: ${MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_ENABLED:-false}
      MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_MODEL: ${MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_MODEL:-openai-codex/gpt-5.4-mini}
      MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_REASONING_EFFORT: ${MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_REASONING_EFFORT:-low}
      MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_TIMEOUT_MS: ${MODEL_MEMORY_PHASE2_CANDIDATE_TRIGGER_TIMEOUT_MS:-30000}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_ENABLED: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_ENABLED:-true}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MODEL: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MODEL:-openai-codex/gpt-5.4}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_REASONING_EFFORT: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_REASONING_EFFORT:-high}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_TIMEOUT_MS: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_TIMEOUT_MS:-120000}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MAX_PER_SESSION: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MAX_PER_SESSION:-12}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MAX_PER_DAY: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_MAX_PER_DAY:-24}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_COOLDOWN_MS: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_COOLDOWN_MS:-900000}
      MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_ASSISTANT_FINAL_INTERVAL: ${MODEL_MEMORY_PHASE2_CANDIDATE_REVIEW_ASSISTANT_FINAL_INTERVAL:-3}
      MODEL_MEMORY_PHASE2_CODEX_SESSION_REVIEW_ENABLED: ${MODEL_MEMORY_PHASE2_CODEX_SESSION_REVIEW_ENABLED:-true}
      MODEL_MEMORY_PHASE2_CODEX_SESSION_ROOT: ${MODEL_MEMORY_PHASE2_CODEX_SESSION_ROOT:-/home/node/.openclaw/external-auth/codex/sessions}
      MODEL_MEMORY_PHASE2_CODEX_HISTORY_PATH: ${MODEL_MEMORY_PHASE2_CODEX_HISTORY_PATH:-/home/node/.openclaw/external-auth/codex/history.jsonl}
      OPENCLAW_HOST_OPERATOR_ENABLED: ${OPENCLAW_HOST_OPERATOR_ENABLED:-true}
      OPENCLAW_HOST_OPERATOR_WRITE_ENABLED: ${OPENCLAW_HOST_OPERATOR_WRITE_ENABLED:-false}
      OPENCLAW_HOST_OPERATOR_EXEC_ENABLED: ${OPENCLAW_HOST_OPERATOR_EXEC_ENABLED:-false}
      OPENCLAW_HOST_OPERATOR_REPO_ROOT: ${OPENCLAW_HOST_OPERATOR_REPO_ROOT:-/home/node/.openclaw/host-operator/openclaw-live}
      OPENCLAW_HOST_OPERATOR_CANONICAL_REPO_ROOT: ${OPENCLAW_HOST_OPERATOR_CANONICAL_REPO_ROOT:-/root/services/openclaw-roles/live}
      OPENCLAW_HOST_OPERATOR_PRODUCT_IMPORT_ROOT: ${OPENCLAW_HOST_OPERATOR_PRODUCT_IMPORT_ROOT:-/home/node/.openclaw/workspace/imports/product_live/content}
      OPENCLAW_HOST_OPERATOR_WORKSPACE_ROOT: ${OPENCLAW_HOST_OPERATOR_WORKSPACE_ROOT:-/home/node/.openclaw/workspace}
      OPENCLAW_HOST_OPERATOR_CANONICAL_WORKSPACE_ROOT: ${OPENCLAW_HOST_OPERATOR_CANONICAL_WORKSPACE_ROOT:-/root/.openclaw/workspace}
      OPENCLAW_HOST_OPERATOR_AUDIT_DIR: ${OPENCLAW_HOST_OPERATOR_AUDIT_DIR:-/home/node/.openclaw/workspace/.openclaw/host-operator-audit}
      OPENCLAW_CODEX_PARITY_KIMI_MAIN_EDIT_ENABLED: ${OPENCLAW_CODEX_PARITY_KIMI_MAIN_EDIT_ENABLED:-false}
      OPENCLAW_CODEX_PARITY_CODEX_AFTER_KIMI_SUCCESS_REQUIRED: ${OPENCLAW_CODEX_PARITY_CODEX_AFTER_KIMI_SUCCESS_REQUIRED:-false}
      OPENCLAW_CODEX_PARITY_FORCE_VALIDATION_REPAIR_PROOF: ${OPENCLAW_CODEX_PARITY_FORCE_VALIDATION_REPAIR_PROOF:-false}
      OPENCLAW_CODEX_PARITY_REQUIRE_HUMAN_SCOPE_DECISION: ${OPENCLAW_CODEX_PARITY_REQUIRE_HUMAN_SCOPE_DECISION:-false}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_CODEX_SESSION_DIR:-/root/.codex/sessions}:/home/node/.openclaw/external-auth/codex/sessions:ro
      - ${OPENCLAW_CODEX_HISTORY_FILE:-/root/.codex/history.jsonl}:/home/node/.openclaw/external-auth/codex/history.jsonl:ro
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /root/services/openclaw-roles/live/.openclaw-memory-ops:/app/.openclaw-memory-ops
      - /root/openclaw-config/agent-workspaces:/home/node/.openclaw/agent-workspaces
      # Canonical workspace-visible host filesystem surfaces.
      - /:/home/node/.openclaw/workspace/system/hostfs:ro
      - /root/services/openclaw-roles/live:/home/node/.openclaw/workspace/imports/product_live/content:ro
      # Scoped host-operator repo bridge. Workspace scope uses the existing workspace mount.
      - /root/services/openclaw-roles/live:/home/node/.openclaw/host-operator/openclaw-live:rw
      - /root/openclaw-config:/home/node/.openclaw/workspace/imports/config_dr/content:ro
      - /root/services/webhook-gateway:/home/node/.openclaw/workspace/imports/webhook_gateway/content:ro
      - /root/.openclaw:/home/node/.openclaw/workspace/imports/runtime_state/content:ro
      - /root/.openclaw/agent-workspaces:/home/node/.openclaw/workspace/imports/agent_workspaces/content:ro
      - /root/data/n8n:/home/node/.openclaw/workspace/imports/n8n_data/content:ro
      - /root/backups:/home/node/.openclaw/workspace/imports/backups/content:ro
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${OPENCLAW_CONFIG_DIR}/.env
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      CODEX_HOME: /home/node/.openclaw/external-auth/codex
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/home/node/.openclaw/.cache/ms-playwright}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      MODEL_MEMORY_HOOK_PROBE_ENABLED: ${MODEL_MEMORY_HOOK_PROBE_ENABLED:-true}
      MODEL_MEMORY_HOOK_PROBE_OUTPUT_DIR: ${MODEL_MEMORY_HOOK_PROBE_OUTPUT_DIR:-/app/.openclaw-memory-ops/hook-runtime-canaries}
      MODEL_MEMORY_ACTIVITY_FEED_ENABLED: ${MODEL_MEMORY_ACTIVITY_FEED_ENABLED:-true}
      MODEL_MEMORY_ACTIVITY_FEED_LEVEL: ${MODEL_MEMORY_ACTIVITY_FEED_LEVEL:-maximal}
      MODEL_MEMORY_PROJECTION_ARTIFACTS_ENABLED: ${MODEL_MEMORY_PROJECTION_ARTIFACTS_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAMS_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAMS_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_OUTPUT_DIR: ${MODEL_MEMORY_CAPTURE_SEAM_OUTPUT_DIR:-/app/.openclaw-memory-ops/capture-seam-runtime}
      MODEL_MEMORY_CAPTURE_SEAM_MESSAGE_PREPROCESSED_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_MESSAGE_PREPROCESSED_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_BATCH_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_INGEST_BATCH_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_ASSEMBLE_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_ASSEMBLE_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_AFTER_TURN_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_CONTEXT_AFTER_TURN_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_TOOL_RESULT_PERSIST_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_TOOL_RESULT_PERSIST_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_AFTER_TOOL_CALL_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_AFTER_TOOL_CALL_ENABLED:-true}
      MODEL_MEMORY_CAPTURE_SEAM_AGENT_END_ENABLED: ${MODEL_MEMORY_CAPTURE_SEAM_AGENT_END_ENABLED:-true}
      MODEL_MEMORY_TOOL_RESULT_PROOF_CAPTURE_ENABLED: ${MODEL_MEMORY_TOOL_RESULT_PROOF_CAPTURE_ENABLED:-true}
      MODEL_MEMORY_CONTEXT_INGEST_PRODUCTION_PROBE_ENABLED: ${MODEL_MEMORY_CONTEXT_INGEST_PRODUCTION_PROBE_ENABLED:-true}
      MODEL_MEMORY_PHASE2_CODEX_SESSION_ROOT: ${MODEL_MEMORY_PHASE2_CODEX_SESSION_ROOT:-/home/node/.openclaw/external-auth/codex/sessions}
      MODEL_MEMORY_PHASE2_CODEX_HISTORY_PATH: ${MODEL_MEMORY_PHASE2_CODEX_HISTORY_PATH:-/home/node/.openclaw/external-auth/codex/history.jsonl}
      OPENCLAW_HOST_OPERATOR_ENABLED: ${OPENCLAW_HOST_OPERATOR_ENABLED:-true}
      OPENCLAW_HOST_OPERATOR_WRITE_ENABLED: ${OPENCLAW_HOST_OPERATOR_WRITE_ENABLED:-false}
      OPENCLAW_HOST_OPERATOR_EXEC_ENABLED: ${OPENCLAW_HOST_OPERATOR_EXEC_ENABLED:-false}
      OPENCLAW_HOST_OPERATOR_REPO_ROOT: ${OPENCLAW_HOST_OPERATOR_REPO_ROOT:-/home/node/.openclaw/host-operator/openclaw-live}
      OPENCLAW_HOST_OPERATOR_CANONICAL_REPO_ROOT: ${OPENCLAW_HOST_OPERATOR_CANONICAL_REPO_ROOT:-/root/services/openclaw-roles/live}
      OPENCLAW_HOST_OPERATOR_PRODUCT_IMPORT_ROOT: ${OPENCLAW_HOST_OPERATOR_PRODUCT_IMPORT_ROOT:-/home/node/.openclaw/workspace/imports/product_live/content}
      OPENCLAW_HOST_OPERATOR_WORKSPACE_ROOT: ${OPENCLAW_HOST_OPERATOR_WORKSPACE_ROOT:-/home/node/.openclaw/workspace}
      OPENCLAW_HOST_OPERATOR_CANONICAL_WORKSPACE_ROOT: ${OPENCLAW_HOST_OPERATOR_CANONICAL_WORKSPACE_ROOT:-/root/.openclaw/workspace}
      OPENCLAW_HOST_OPERATOR_AUDIT_DIR: ${OPENCLAW_HOST_OPERATOR_AUDIT_DIR:-/home/node/.openclaw/workspace/.openclaw/host-operator-audit}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_CODEX_SESSION_DIR:-/root/.codex/sessions}:/home/node/.openclaw/external-auth/codex/sessions:ro
      - ${OPENCLAW_CODEX_HISTORY_FILE:-/root/.codex/history.jsonl}:/home/node/.openclaw/external-auth/codex/history.jsonl:ro
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /root/services/openclaw-roles/live/.openclaw-memory-ops:/app/.openclaw-memory-ops
      - /root/openclaw-config/agent-workspaces:/home/node/.openclaw/agent-workspaces
      # Canonical workspace-visible host filesystem surfaces.
      - /:/home/node/.openclaw/workspace/system/hostfs:ro
      - /root/services/openclaw-roles/live:/home/node/.openclaw/workspace/imports/product_live/content:ro
      # Scoped host-operator repo bridge. Workspace scope uses the existing workspace mount.
      - /root/services/openclaw-roles/live:/home/node/.openclaw/host-operator/openclaw-live:rw
      - /root/openclaw-config:/home/node/.openclaw/workspace/imports/config_dr/content:ro
      - /root/services/webhook-gateway:/home/node/.openclaw/workspace/imports/webhook_gateway/content:ro
      - /root/.openclaw:/home/node/.openclaw/workspace/imports/runtime_state/content:ro
      - /root/.openclaw/agent-workspaces:/home/node/.openclaw/workspace/imports/agent_workspaces/content:ro
      - /root/data/n8n:/home/node/.openclaw/workspace/imports/n8n_data/content:ro
      - /root/backups:/home/node/.openclaw/workspace/imports/backups/content:ro
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
